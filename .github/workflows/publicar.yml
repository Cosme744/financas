# Publica a pasta app/ no GitHub Pages a cada push na main.
#
# Só o conteúdo de app/ vira site. O backend/ fica versionado no repositório
# mas nunca é servido — ele roda dentro do Apps Script, não aqui.

name: Publicar app

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite publicar na mão pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois pushes chegarem juntos, o último ganha em vez de brigarem.
#
# O nome leva o ref de propósito. Um grupo global vira ponto único de
# travamento: quando o GitHub deixou duas execuções presas em "queued" sem
# job (estado que nem force-cancel desfaz), elas seguraram o grupo e nenhum
# push seguinte conseguia mais criar execução. Com o ref no nome, um grupo
# emperrado não leva os outros junto.
concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deploy
        uses: actions/deploy-pages@v4
